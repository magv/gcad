[project]
name = "gcad"
description = "Generic Cylindrical Algebraic Decomposition"
requires-python = ">=3.10"
dependencies = ["sympy>=1.13"]
readme = "README.md"
license = "GPL-3.0-or-later"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Topic :: Scientific/Engineering :: Mathematics"
]
authors = [{name = "Vitaly Magerya"}]

dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/magv/gcad"

[project.optional-dependencies]
testing = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow"]

[build-system]
requires = ["cython>=3.1", "setuptools>=79", "setuptools-scm[simple]>=9.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
version_file = "gcad/_version.py"
version_file_template = """\
# This file is generated automatically during build.
__version__: str = {version!r}
"""

[tool.setuptools]
packages = ["gcad", "gcad_ext"]

[tool.setuptools.package-data]
gcad_ext = [
    "flint_tools.cpp",
    "gcad.cpp",
    "gcad_ext.pyx",
    "logging.cpp",
    "root_isolation.cpp",
    "shortest_fraction_between.cpp",
]

[[tool.setuptools.ext-modules]]
name = "gcad_ext"
sources = ["gcad_ext/gcad_ext.pyx"]
depends = [
    "gcad_ext/flint_tools.cpp",
    "gcad_ext/gcad.cpp",
    "gcad_ext/logging.cpp",
    "gcad_ext/root_isolation.cpp",
    "gcad_ext/shortest_fraction_between.cpp",
]
libraries = ["flint", "mpfr", "gmp"]
extra-compile-args = [
    "-std=c++17",
    "-Wno-unused-function",
    "-DPy_LIMITED_API=0x030A0000",
    "-UNDEBUG",
]
py-limited-api = true

[tool.distutils.bdist_wheel]
py-limited-api = "cp310"
